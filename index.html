<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NBA 2025 Playoff Bracket Picker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      padding: 20px;
      text-align: center;
    }
    h1 {
      margin-bottom: 30px;
    }
    .bracket {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      overflow-x: auto;
    }
    .round {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .matchup {
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 10px;
      min-width: 180px;
    }
    .matchup strong {
      display: block;
      margin-bottom: 6px;
    }
    .matchup button {
      display: block;
      width: 100%;
      margin: 5px 0;
      padding: 6px;
      border: none;
      border-radius: 4px;
      background: #eee;
      cursor: pointer;
    }
    .matchup button.selected {
      background: #4caf50;
      color: white;
    }
  </style>
</head>
<body>
  <h1>NBA 2025 Playoff Bracket Picker</h1>
  <div class="bracket" id="bracket"></div>

  <script>
    const bracket = document.getElementById('bracket');

    const rounds = [
      {
        title: 'Play-In',
        matchups: [
          ['Warriors', 'Grizzlies'],
          ['Kings', 'Mavericks'],
          ['Magic', 'Hawks'],
          ['Bulls', 'Heat']
        ]
      },
      {
        title: 'First Round',
        matchups: [
          ['Thunder', 'TBD'],
          ['Nuggets', 'Clippers'],
          ['Lakers', 'Timberwolves'],
          ['Rockets', 'TBD'],
          ['Cavaliers', 'TBD'],
          ['Pacers', 'Bucks'],
          ['Knicks', 'Pistons'],
          ['Celtics', 'TBD']
        ]
      },
      {
        title: 'Semifinals',
        matchups: [
          ['', ''], ['', ''], ['', ''], ['', '']
        ]
      },
      {
        title: 'Conference Finals',
        matchups: [
          ['', ''], ['', '']
        ]
      },
      {
        title: 'NBA Finals',
        matchups: [
          ['', '']
        ]
      }
    ];

    const winners = {};

    function createBracket() {
      bracket.innerHTML = '';

      rounds.forEach((round, rIdx) => {
        const col = document.createElement('div');
        col.className = 'round';

        const header = document.createElement('h3');
        header.textContent = round.title;
        col.appendChild(header);

        round.matchups.forEach((teams, mIdx) => {
          const match = document.createElement('div');
          match.className = 'matchup';

          const label = document.createElement('strong');
          label.textContent = teams[0] + ' vs ' + teams[1];
          match.appendChild(label);

          teams.forEach((team, tIdx) => {
            const btn = document.createElement('button');
            btn.textContent = team;
            btn.onclick = () => {
              const all = match.querySelectorAll('button');
              all.forEach(b => b.classList.remove('selected'));
              btn.classList.add('selected');
              winners[`r${rIdx}m${mIdx}`] = btn.textContent;
              updateNextRounds();
            };
            match.appendChild(btn);
          });

          col.appendChild(match);
        });

        bracket.appendChild(col);
      });
    }

    function updateNextRounds() {
      // Fill Semis
      for (let i = 0; i < 4; i++) {
        const a = winners[`r1m${i*2}`];
        const b = winners[`r1m${i*2+1}`];
        if (a && b) rounds[2].matchups[i] = [a, b];
      }
      // Fill Conf Finals
      for (let i = 0; i < 2; i++) {
        const a = winners[`r2m${i*2}`];
        const b = winners[`r2m${i*2+1}`];
        if (a && b) rounds[3].matchups[i] = [a, b];
      }
      // Fill NBA Finals
      const a = winners[`r3m0`];
      const b = winners[`r3m1`];
      if (a && b) rounds[4].matchups[0] = [a, b];

      createBracket();
      // Reapply selections
      Object.keys(winners).forEach(k => {
        const match = document.querySelector(`.round:nth-child(${parseInt(k[1])+1}) .matchup:nth-child(${parseInt(k[3])+2})`);
        if (match) {
          const btns = match.querySelectorAll('button');
          btns.forEach(btn => {
            if (btn.textContent === winners[k]) btn.classList.add('selected');
          });
        }
      });
    }

    createBracket();
  </script>
</body>
</html>
