<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NBA 2025 Playoff Bracket Picker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      padding: 20px;
      text-align: center;
    }
    h1 {
      margin-bottom: 30px;
    }
    .bracket {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }
    .region {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }
    .round {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .matchup {
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 10px;
      min-width: 180px;
    }
    .matchup strong {
      display: block;
      margin-bottom: 6px;
    }
    .matchup button {
      display: block;
      width: 100%;
      margin: 5px 0;
      padding: 6px;
      border: none;
      border-radius: 4px;
      background: #eee;
      cursor: pointer;
    }
    .matchup button.selected {
      background: #4caf50;
      color: white;
    }
  </style>
</head>
<body>
  <h1>NBA 2025 Playoff Bracket Picker</h1>
  <div class="bracket">
    <h2>Western Conference</h2>
    <div class="region" id="west"></div>
    <h2>Eastern Conference</h2>
    <div class="region" id="east"></div>
    <h2>NBA Finals</h2>
    <div id="finals"></div>
  </div>

  <script>
    const structure = {
      west: [
        ['Warriors', 'Grizzlies'],
        ['Kings', 'Mavericks'],
        ['Thunder', 'TBD'],
        ['Nuggets', 'Clippers'],
        ['Lakers', 'Timberwolves'],
        ['Rockets', 'TBD'],
        ['', ''], ['', ''], ['', '']
      ],
      east: [
        ['Magic', 'Hawks'],
        ['Bulls', 'Heat'],
        ['Cavaliers', 'TBD'],
        ['Pacers', 'Bucks'],
        ['Knicks', 'Pistons'],
        ['Celtics', 'TBD'],
        ['', ''], ['', ''], ['', '']
      ],
      finals: [['', '']]
    };

    const winners = {};

    function renderRegion(regionId, data) {
      const region = document.getElementById(regionId);
      region.innerHTML = '';
      const columns = [[], [], [], []];
      data.forEach((match, idx) => {
        const round = Math.floor(idx / 2);
        const m = document.createElement('div');
        m.className = 'matchup';
        const label = document.createElement('strong');
        label.textContent = match[0] + ' vs ' + match[1];
        m.appendChild(label);
        match.forEach(team => {
          const btn = document.createElement('button');
          btn.textContent = team;
          btn.onclick = () => {
            const all = m.querySelectorAll('button');
            all.forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            winners[regionId + '_' + idx] = team;
            updateRegion(regionId);
          };
          m.appendChild(btn);
        });
        columns[round].push(m);
      });
      columns.forEach(col => {
        const roundDiv = document.createElement('div');
        roundDiv.className = 'round';
        col.forEach(m => roundDiv.appendChild(m));
        region.appendChild(roundDiv);
      });
    }

    function updateRegion(regionId) {
      const current = structure[regionId];
      for (let i = 6; i < 9; i++) {
        const a = winners[regionId + '_' + ((i - 6) * 2 + 2)];
        const b = winners[regionId + '_' + ((i - 6) * 2 + 3)];
        structure[regionId][i] = [a || '', b || ''];
      }
      const finalist = winners[regionId + '_8'];
      structure.finals[0][regionId === 'west' ? 0 : 1] = finalist || '';
      renderAll();
    }

    function renderFinals() {
      const finalsDiv = document.getElementById('finals');
      finalsDiv.innerHTML = '';
      const match = document.createElement('div');
      match.className = 'matchup';
      const [team1, team2] = structure.finals[0];
      const label = document.createElement('strong');
      label.textContent = team1 + ' vs ' + team2;
      match.appendChild(label);
      [team1, team2].forEach(team => {
        const btn = document.createElement('button');
        btn.textContent = team;
        btn.onclick = () => {
          const all = match.querySelectorAll('button');
          all.forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
        };
        match.appendChild(btn);
      });
      finalsDiv.appendChild(match);
    }

    function renderAll() {
      renderRegion('west', structure.west);
      renderRegion('east', structure.east);
      renderFinals();
    }

    renderAll();
  </script>
</body>
</html>
